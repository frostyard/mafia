description: Personal MAFIA virtual machine
config:
  boot.autostart: "true"
  boot.autostart.priority: "50"
  limits.cpu: "8"
  limits.memory: 16GiB
  cloud-init.vendor-data: |
    #cloud-config
    package_update: true
    packages:
      - bubblewrap
      - ca-certificates
      - curl
      - git
      - podman
      - python3
      - python3-venv
      - uidmap
    users:
      - default
      - name: mafia
        uid: 1001
        gecos: MAFIA service
        homedir: /var/lib/mafia
        shell: /bin/bash
        groups:
          - sudo
        lock_passwd: true
        sudo:
          - ALL=(ALL) NOPASSWD:ALL
    runcmd:
      - [install, -d, -m, "0700", -o, mafia, -g, mafia, /var/lib/mafia]
      - [install, -d, -m, "0700", -o, mafia, -g, mafia, /var/lib/mafia/data]
      - [install, -d, -m, "0755", -o, mafia, -g, mafia, /opt/mafia]
      - [install, -d, -m, "0750", -o, root, -g, mafia, /etc/mafia]
      - [loginctl, enable-linger, mafia]
devices:
  mafia-data:
    type: disk
    pool: default
    source: mafia-personal-data
    path: /var/lib/mafia
